name: release

# Packaging is CI-only: a tag push runs the tests and writes the GitHub Release.
# No manual `gh release create`, and deliberately no npm publish — the skill is
# consumed from git by `/plugin marketplace add` and `npx skills add`, so a
# registry package would only add a credential to rotate and a version to keep in
# sync. Nothing here depends on npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to release
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tests and tag/version agreement
    runs-on: ubuntu-latest
    steps:
      # Tests and the version check must run against the tag being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: tag equals package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json v$version"
            exit 1
          fi

  release:
    name: github release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Default ref on purpose: a tag published before scripts/ existed cannot run
      # the notes script, so the tooling comes from the workflow commit while the
      # version comes from the tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-notes.mjs "${TAG#v}" > notes.md
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi